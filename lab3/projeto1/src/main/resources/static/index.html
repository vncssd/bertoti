<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Músicas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.2.1/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body>
    <header>
        <nav>
            <h1>Lista de Músicas</h1>
            <button id="openModalBtn" class="btn btn-info">Adicionar +</button>

            <div class="w3-container">
                <div id="id01" class="w3-modal">
                    <div class="w3-modal-content">
                        <div class="w3-container">
                            <span id="closeModalBtn" class="w3-button w3-display-topright">&times;</span>
                            <h2 id="modalTitle">Adicionar uma nova música</h2>

                            <div class="form-group">
                                <label for="inputID">ID da música</label>
                                <input type="text" class="form-control" id="inputID" disabled>
                            </div>
                            <div class="form-group">
                                <label for="nomeMusica">Nome da música</label>
                                <input type="text" class="form-control" id="nomeMusica" placeholder="Nome">
                            </div>
                            <div class="form-group">
                                <label for="artistasMusica">Artista(s)</label>
                                <input type="text" class="form-control" id="artistasMusica" placeholder="Separe os artistas por vírgula">
                            </div>
                            <div class="form-group">
                                <label for="duracaoMusica">Duração (mm:ss)</label>
                                <input type="text" class="form-control" id="duracaoMusica" placeholder="03:45">
                            </div>
                            <p id="formError" class="text-danger"></p>
                            <button id="submitBtn" class="btn btn-primary">Adicionar</button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="jumbotron">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Artista(s)</th>
                    <th>Duração</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="song-list"></tbody>
        </table>
    </main>

    <script src="index.js"></script>
</body>
</html>
